kind = "mobile"
previewPath = "/"
title = "PRICINA Owner"
description = "A private owner app for PRICINA to securely monitor, search, and manage customer inquiries from the existing Firebase leads collection in real time."
version = "1.0.0"
id = "artifacts/pricina-owner"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 22670

[services.development]
run = "pnpm --filter @workspace/pricina-owner run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pricina-owner", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/pricina-owner", "run", "serve" ]

[services.env]
PORT = "22670"
BASE_PATH = "/"
